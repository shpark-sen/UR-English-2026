<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Robot Tug of War</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one projector screen — 7×5 board grid (U-shaped track of 13 sentence cells), charging stations on the top corners,
   sentence banner across the top middle, team controls in the open middle */
:root{
  --bg:#e8f3f1; --panel:#ffffff; --ink:#1f2d3a; --muted:#5d6f7c; --line:#c9ddd8;
  --accent:#ff7a45; --cur:#ffe45c; --start:#dff3ec; --slot:#f3f8f7;
  --left:#f5d02e; --left-soft:#fdf1bd; --right:#8cc84b; --right-soft:#e3f2d2; --red:#e03a2f; --banner:#fff7d6;
  --display:"Jua","배달의민족 주아","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --emoji:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#13212b; --panel:#1c2e3a; --ink:#eef5f4; --muted:#9db2bd; --line:#2d4554;
  --accent:#ff8a5c; --cur:#7a6510; --start:#21413a; --slot:#233847;
  --left:#c9a91c; --left-soft:#3d3716; --right:#6ea43a; --right-soft:#26391a; --red:#ff6b5e; --banner:#2f2a17; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#13212b; --panel:#1c2e3a; --ink:#eef5f4; --muted:#9db2bd; --line:#2d4554;
  --accent:#ff8a5c; --cur:#7a6510; --start:#21413a; --slot:#233847;
  --left:#c9a91c; --left-soft:#3d3716; --right:#6ea43a; --right-soft:#26391a; --red:#ff6b5e; --banner:#2f2a17; color-scheme:dark}
html,body{height:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);margin:0;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:12px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.board{max-width:1800px;height:100%;margin:0 auto;display:grid;
  grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:1.55fr repeat(4,minmax(0,1fr));
  gap:clamp(6px,1.1vh,14px) clamp(6px,0.9vw,16px);--u:min(1vw,1.75vh)}

.station{border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-align:center;
  font-family:var(--display);font-size:calc(var(--u)*2.4);line-height:1.15;color:#1f2d3a;position:relative}
.station.L{background:var(--left);grid-column:1;grid-row:1}
.station.R{background:var(--right);grid-column:7;grid-row:1}
.station .bat{font-family:var(--emoji);font-size:calc(var(--u)*4);line-height:1;margin-bottom:.15em}
.station.ready{cursor:pointer;animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 0%,transparent)}to{box-shadow:0 0 0 calc(var(--u)*1) color-mix(in srgb,var(--accent) 55%,transparent)}}
.charge{font-family:var(--display);font-size:calc(var(--u)*2.8);white-space:nowrap;border:0;border-radius:20px;padding:.35em .8em;width:100%;color:#1f2d3a;
  display:flex;align-items:center;justify-content:center;gap:.3em;animation:glow 1s ease-in-out infinite alternate}
.charge .e{font-family:var(--emoji)}
.charge.L{background:var(--left)}.charge.R{background:var(--right)}

.banner{grid-column:2 / 7;grid-row:1;background:var(--banner);border:3px solid var(--accent);border-radius:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4px 16px;min-width:0}
.banner .who{font-family:var(--display);font-size:calc(var(--u)*2.1);color:var(--muted)}
.banner .who.L{color:#9a7b00}.banner .who.R{color:#3f7a12}
:root[data-theme="dark"] .banner .who.L,:root[data-theme="dark"] .banner .who.R{color:var(--ink)}
.banner .sen{font-family:var(--display);font-size:calc(var(--u)*5.2);line-height:1.1;text-wrap:balance}
.banner .sen b{font-weight:400;color:var(--accent);margin-right:.25em}
.banner.pop .sen{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}

.cell{border:2px solid var(--line);background:var(--panel);border-radius:16px;padding:.35em .45em;text-align:center;
  display:flex;flex-direction:column;justify-content:center;align-items:center;position:relative;min-width:0;min-height:0;
  font-size:calc(var(--u)*1.85);line-height:1.15;transition:background .2s,border-color .2s}
.cell .n{position:absolute;top:.25em;left:.5em;font-size:.7em;color:var(--muted);font-family:var(--display)}
.cell .t{font-family:var(--display)}
.cell.start{background:var(--start)}
.cell.cur{background:var(--cur);border-color:var(--accent);border-width:4px}
.cell.cur .n{color:var(--accent)}
.cell.trail-L{box-shadow:inset 0 0 0 4px var(--left)}
.cell.trail-R{box-shadow:inset 0 0 0 4px var(--right)}
.robot{position:absolute;top:-.55em;right:-.25em;font-family:var(--emoji);font-size:2.3em;line-height:1;animation:hop .45s ease-out;pointer-events:none;
  filter:drop-shadow(0 2px 2px rgba(0,0,0,.25))}
@keyframes hop{0%{transform:translateY(-55%) scale(.85)}55%{transform:translateY(6%) scale(1.08,.92)}100%{transform:translateY(0) scale(1)}}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}

.mid{grid-column:2 / 7;grid-row:2 / 5;display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(8px,1.4vw,24px);align-items:stretch;min-height:0}
.team{border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.2);padding:10px;min-width:0}
.team.L{background:var(--left-soft);border:3px solid var(--left)}
.team.R{background:var(--right-soft);border:3px solid var(--right)}
.team h2{margin:0;font-family:var(--display);font-weight:400;font-size:calc(var(--u)*3)}
.team h2 .arr{font-family:var(--display)}
.team p{margin:0;color:var(--muted);font-size:calc(var(--u)*1.5)}
.hands{display:flex;gap:calc(var(--u)*.8);flex-wrap:wrap;justify-content:center}
.hand{border:3px solid transparent;background:var(--panel);border-radius:18px;padding:.25em .45em;display:flex;flex-direction:column;align-items:center;
  font-family:var(--display);font-size:calc(var(--u)*1.8);min-width:3.4em}
.hand .e{font-family:var(--emoji);font-size:2em;line-height:1.1}
.team.L .hand:hover{border-color:var(--left)}
.team.R .hand:hover{border-color:var(--right)}
.hand:disabled{opacity:.35;cursor:default}

.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--u)*1.1);min-width:0;width:clamp(150px,17vw,320px)}
.step{font-family:var(--display);font-size:calc(var(--u)*2.4);border:0;border-radius:18px;padding:.45em .8em;background:var(--accent);color:#fff;width:100%}
.step small{display:block;font-family:var(--body);font-size:.55em;opacity:.9}
.step:disabled{background:var(--slot);color:var(--muted);cursor:default}
.tset{display:flex;align-items:center;gap:4px;font-size:calc(var(--u)*1.6)}
.tset input{width:3.2em;font:inherit;font-family:var(--display);text-align:center;border:2px solid var(--line);border-radius:10px;padding:.15em .2em;background:var(--panel);color:var(--ink)}
.tset input:disabled{opacity:.5}
.timer{font-family:var(--display);font-size:calc(var(--u)*3.4);font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--red)}
.row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.chip{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:.25em .8em;font-size:calc(var(--u)*1.35)}

.c4{grid-column:1;grid-row:5}.c5{grid-column:2;grid-row:5}.c6{grid-column:3;grid-row:5}.c7{grid-column:4;grid-row:5}
.c8{grid-column:5;grid-row:5}.c9{grid-column:6;grid-row:5}.c10{grid-column:7;grid-row:5}
.c3{grid-column:1;grid-row:4}.c2{grid-column:1;grid-row:3}.c1{grid-column:1;grid-row:2}
.c11{grid-column:7;grid-row:4}.c12{grid-column:7;grid-row:3}.c13{grid-column:7;grid-row:2}

/* win overlay */
.win{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--bg) 85%,transparent);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.win .card{background:var(--panel);border:4px solid var(--accent);border-radius:30px;padding:clamp(20px,4vh,50px) clamp(20px,4vw,70px);text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:clamp(8px,2vh,22px);max-width:100%}
.win .big{font-family:var(--emoji);font-size:clamp(70px,16vh,180px);line-height:1}
.win h3{margin:0;font-family:var(--display);font-weight:400;font-size:clamp(34px,8vh,96px);color:var(--red)}
.win p{margin:0;font-family:var(--display);font-size:clamp(20px,4vh,46px)}
.win .again{font-family:var(--display);font-size:clamp(18px,3vh,32px);border:0;border-radius:16px;padding:.4em 1.1em;background:var(--accent);color:#fff}

@media (max-width:760px){
  .board{height:auto;grid-template-columns:repeat(7,minmax(0,1fr));grid-template-rows:auto repeat(4,auto);--u:1.4vw}
  .banner{grid-column:1 / 8;grid-row:1}.station{display:none}
  .mid{grid-template-columns:1fr;grid-column:2 / 7}
  .center{width:auto}
  .cell{font-size:9px;min-height:64px}
  .banner .sen{font-size:22px}.banner .who{font-size:14px}
  .team h2{font-size:18px}.hand{font-size:14px}.step{font-size:18px}.timer{font-size:24px}.chip{font-size:12px}.team p{font-size:12px}
}
@media (prefers-reduced-motion: reduce){.robot,.banner.pop .sen{animation:none}}
</style>
</head>
<body>

<div class="board" id="board">
  <div class="station L"><span class="bat">🔋</span>왼쪽 팀<br>충전소</div>
  <div class="banner" id="banner"><div class="who" id="who">반 전체가 함께 읽어요!</div><div class="sen" id="sen"></div></div>
  <div class="station R"><span class="bat">🔋</span>오른쪽 팀<br>충전소</div>

  <div class="mid">
    <section class="team L" aria-label="왼쪽 팀">
      <h2><span class="arr">◀</span> 왼쪽 팀</h2>
      <p>가위바위보에서 이긴 손을 눌러요</p>
      <div class="hands">
        <button class="hand" data-team="L" data-n="1"><span class="e">✌️</span>1칸</button>
        <button class="hand" data-team="L" data-n="2"><span class="e">✊</span>2칸</button>
        <button class="hand" data-team="L" data-n="3"><span class="e">✋</span>3칸</button>
      </div>
    </section>

    <div class="center">
      <button class="charge" id="chargeBtn" hidden><span class="e">🔋</span>충전하기!</button>
      <div class="timer" id="timer">05:00</div>
      <div class="tset" id="tset">
        <label for="minIn">⏱</label>
        <input id="minIn" type="number" min="0" max="99" value="5" inputmode="numeric" aria-label="분"><span>분</span>
        <input id="secIn" type="number" min="0" max="59" value="0" step="5" inputmode="numeric" aria-label="초"><span>초</span>
      </div>
      <div class="row">
        <button class="chip" id="timerBtn">▶ 시작</button>
      </div>
      <div class="row">
        <button class="chip" id="undoBtn">↶ 되돌리기</button>
        <button class="chip" id="resetBtn">↺ 처음부터</button>
        <button class="chip" id="fsBtn">⛶ 전체화면</button>
      </div>
    </div>

    <section class="team R" aria-label="오른쪽 팀">
      <h2>오른쪽 팀 <span class="arr">▶</span></h2>
      <p>가위바위보에서 이긴 손을 눌러요</p>
      <div class="hands">
        <button class="hand" data-team="R" data-n="1"><span class="e">✌️</span>1칸</button>
        <button class="hand" data-team="R" data-n="2"><span class="e">✊</span>2칸</button>
        <button class="hand" data-team="R" data-n="3"><span class="e">✋</span>3칸</button>
      </div>
    </section>
  </div>
</div>

<div class="win" id="win" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <div class="big" id="winEmoji">🔋🤖</div>
    <h3 id="winTitle">충전 완료!</h3>
    <p id="winText"></p>
    <button class="again" id="againBtn">다시 하기</button>
  </div>
</div>

<script>
const CELLS = {
  1:"I want to help animals.", 2:"I want to make robots.", 3:"I want to be an animal doctor.",
  4:"I want to design cars.", 5:"I want to be a cook.", 6:"I want to make food.",
  7:"What do you want to be?",
  8:"I want to be a scientist.", 9:"I want to teach English.", 10:"I want to play in the World Cup.",
  11:"I want to be a car designer.", 12:"I want to be a teacher.", 13:"I want to be a soccer player."
};
const $ = id => document.getElementById(id);
const board = $("board");
const cellEls = {};
for (let n=1;n<=13;n++){
  const b = document.createElement("button");
  b.className = "cell c"+n + (n===7 ? " start":"");
  b.innerHTML = `<span class="n">${n}${n===7?" START":""}</span><span class="t">${CELLS[n]}</span>`;
  b.title = n+"번 칸으로 로봇 옮기기";
  b.onclick = ()=>{ if (S.moving) return; pushHist(); S.pos=n; S.team=null; render(true); checkWin(); };
  board.appendChild(b); cellEls[n]=b;
}

const S = {pos:7, team:null, hist:[], over:false, moving:false};
const STEP_MS = 520;
function pushHist(){ S.hist.push(JSON.stringify({pos:S.pos,team:S.team})); if(S.hist.length>50) S.hist.shift(); }

function render(pop, cellsOnly){
  for (let n=1;n<=13;n++){
    const c = cellEls[n];
    c.classList.toggle("cur", n===S.pos);
    const r = c.querySelector(".robot");
    if (n===S.pos && !r){ const sp=document.createElement("span"); sp.className="robot"; sp.textContent="🤖"; c.appendChild(sp); }
    if (n!==S.pos && r) r.remove();
  }
  document.querySelectorAll(".hand").forEach(h=>h.disabled = S.over || S.moving);
  const ready = S.over && !S.moving && (S.pos===1 || S.pos===13);
  const side = S.pos===1 ? "L" : "R";
  $("chargeBtn").hidden = !ready;
  $("tset").hidden = ready; $("timerBtn").parentElement.hidden = ready;
  $("chargeBtn").className = "charge " + side;
  document.querySelector(".station.L").classList.toggle("ready", ready && side==="L");
  document.querySelector(".station.R").classList.toggle("ready", ready && side==="R");
  if (cellsOnly) return;
  $("sen").innerHTML = `<b>${S.pos}.</b>${CELLS[S.pos]}`;
  const who = $("who");
  who.className = "who" + (S.team ? " "+S.team : "");
  who.textContent = S.team ? (S.team==="L" ? "왼쪽 팀만 읽어요!" : "오른쪽 팀만 읽어요!") : "반 전체가 함께 읽어요!";
  if (ready) who.textContent = (side==="L" ? "왼쪽 팀" : "오른쪽 팀") + "이 마지막 문장을 읽고 충전해요!";
  if (pop){ const b=$("banner"); b.classList.remove("pop"); void b.offsetWidth; b.classList.add("pop"); }
}

function choose(team, n){
  if (S.over || S.moving) return;
  pushHist();
  const dir = team==="L" ? -1 : 1;
  const target = Math.min(13, Math.max(1, S.pos + dir*n));
  S.moving = true;
  const who = $("who");
  who.className = "who " + team;
  who.textContent = (team==="L" ? "◀ 왼쪽 팀이 " : "오른쪽 팀이 ▶ ") + Math.abs(target-S.pos) + "칸 당겨요!";
  const hop = ()=>{
    S.pos += dir;
    render(false, true);
    if (S.pos !== target) setTimeout(hop, STEP_MS);
    else setTimeout(()=>{ S.moving=false; S.team=team; render(true); checkWin(); }, 250);
  };
  setTimeout(hop, 150);
}
function checkWin(){
  if (S.pos===1 || S.pos===13){
    // 마지막 문장을 먼저 읽고, 충전하기 버튼을 눌러야 승리 화면이 나와요
    S.over = true; render(true);
  }
}
function charge(){
  if (!(S.over && (S.pos===1 || S.pos===13))) return;
  showWin(S.pos===1 ? "왼쪽 팀" : "오른쪽 팀", `${S.pos}. ${CELLS[S.pos]}`);
}
$("chargeBtn").onclick = charge;
document.querySelectorAll(".station").forEach(st=>st.addEventListener("click", ()=>{ if (st.classList.contains("ready")) charge(); }));
function showWin(teamName, line, title){
  $("winTitle").textContent = title || "충전 완료!";
  $("winText").innerHTML = teamName ? `${teamName} 승리! 🎉<br><span style="font-size:.7em;color:var(--muted)">${line}</span>` : line;
  $("winEmoji").textContent = teamName ? "🔋🤖" : "🤝";
  $("win").hidden = false; $("againBtn").focus();
  stopTimer();
}
function reset(){
  if (S.moving) return;
  S.pos=7; S.team=null; S.hist=[]; S.over=false;
  $("win").hidden = true; stopTimer(); T.rem = readInputs(); drawTimer(); render(true);
}

document.querySelectorAll(".hand").forEach(h=>h.onclick = ()=>choose(h.dataset.team, +h.dataset.n));
$("undoBtn").onclick = ()=>{
  if (S.moving) return;
  const h = S.hist.pop(); if (!h) return;
  Object.assign(S, JSON.parse(h)); S.over=false; $("win").hidden = true; render(true);
};
$("resetBtn").onclick = reset;
$("againBtn").onclick = reset;
$("win").addEventListener("click", e=>{ if (e.target.id==="win") $("win").hidden = true; });

// timer — 선생님이 분·초를 직접 입력
const T = {rem:300, id:null};
function readInputs(){
  const m = Math.max(0, Math.min(99, parseInt($("minIn").value,10) || 0));
  const sec = Math.max(0, Math.min(59, parseInt($("secIn").value,10) || 0));
  return m*60 + sec;
}
function drawTimer(){
  const m = Math.floor(T.rem/60), sec = T.rem%60;
  $("timer").textContent = String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
  $("timer").classList.toggle("low", T.id && T.rem<=30);
  $("timerBtn").textContent = T.id ? "❚❚ 멈춤" : (T.rem < readInputs() && T.rem>0 ? "▶ 계속" : "▶ 시작");
  $("minIn").disabled = $("secIn").disabled = !!T.id;
}
function stopTimer(){ if (T.id){ clearInterval(T.id); T.id=null; } drawTimer(); }
["minIn","secIn"].forEach(id=>$(id).addEventListener("input", ()=>{ if (!T.id){ T.rem = readInputs(); drawTimer(); } }));
$("timerBtn").onclick = ()=>{
  if (T.id){ stopTimer(); return; }
  if (T.rem<=0) T.rem = readInputs();
  if (T.rem<=0) return;
  T.id = setInterval(()=>{
    T.rem--; drawTimer();
    if (T.rem<=0){
      stopTimer();
      if (!S.over){
        S.over = true; render(false);
        if (S.pos<7) showWin("왼쪽 팀", `로봇이 ${S.pos}번 칸에 있어요.`, "시간 끝!");
        else if (S.pos>7) showWin("오른쪽 팀", `로봇이 ${S.pos}번 칸에 있어요.`, "시간 끝!");
        else showWin(null, "로봇이 가운데에 있어요. 무승부!", "시간 끝!");
      }
    }
  }, 1000);
  drawTimer();
};
$("fsBtn").onclick = ()=>{
  try{ if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>{}); }catch(e){}
};
document.addEventListener("fullscreenchange", ()=>{
  $("fsBtn").textContent = document.fullscreenElement ? "✕ 전체화면 끄기" : "⛶ 전체화면";
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape") $("win").hidden = true;
});

render(false); drawTimer();
</script>
</body>
</html>
